project_id = "aura-foundation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101/auth/callback", "http://127.0.0.1:3101/reset-password"]
minimum_password_length = 12

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
